<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#07090c" />
<title>Quotes Admin | Wigan Wetbelts</title>
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090c; --bg-2:#0b0e12; --surface:#10141a; --surface-2:#151a21;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --text:#f2f3f5; --text-2:#aab1ba; --muted:#707883;
  --accent:#9ed1ff; --accent-2:#e6f3ff;
  --accent-dim:rgba(158,208,255,.12); --accent-line:rgba(158,208,255,.28);
  --ok:#4ade80; --warn:#f87171; --amber:#fbbf24;
  --radius:16px; --radius-s:10px;
  --font-d:"Space Grotesk","Inter",sans-serif; --font-t:"Inter",system-ui,sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:var(--bg); color:var(--text); font-family:var(--font-t); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh; }
h1,h2,h3{ font-family:var(--font-d); font-weight:600; letter-spacing:-.01em; }
button{ font-family:inherit; cursor:pointer; }
input,select,textarea{ font-family:inherit; font-size:.95rem; color:var(--text); background:var(--bg-2); border:1px solid var(--line-2); border-radius:var(--radius-s); padding:12px 14px; outline:none; width:100%; }
input:focus,textarea:focus{ border-color:var(--accent-line); }
.wrap{ max-width:1080px; margin:0 auto; padding:0 18px; }

/* login */
#loginView{ display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.login-card{ width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line-2); border-radius:var(--radius); padding:34px 30px; }
.brand-logo{ display:block; width:220px; margin:0 auto 22px; }
.login-card h1{ font-size:1.25rem; text-align:center; margin-bottom:4px; }
.login-card p{ font-size:.88rem; color:var(--text-2); text-align:center; margin-bottom:22px; }
.login-card label{ display:block; font-size:.72rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--text-2); margin:14px 0 6px; }
#loginErr{ display:none; margin-top:14px; font-size:.86rem; color:var(--warn); text-align:center; }
#loginErr.show{ display:block; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; border:1px solid transparent; font-weight:600; font-size:.92rem; padding:13px 22px; transition:all .16s ease; }
.btn-primary{ background:linear-gradient(180deg, var(--accent-2), var(--accent)); color:#06121f; width:100%; margin-top:22px; }
.btn-primary:disabled{ opacity:.55; cursor:default; }
.btn-ghost{ background:transparent; border-color:var(--line-2); color:var(--text-2); padding:9px 16px; font-size:.84rem; }
.btn-ghost:hover{ border-color:var(--accent-line); color:var(--text); }

/* app shell */
#appView{ display:none; padding-bottom:80px; }
.topbar{ position:sticky; top:0; z-index:10; background:rgba(10,11,13,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
.topbar-inner{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; }
.topbar svg{ width:150px; height:auto; display:block; }
.topbar-actions{ display:flex; gap:8px; align-items:center; }

.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:18px 0; }
.stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-s); padding:14px 16px; }
.stat b{ display:block; font-family:var(--font-d); font-size:1.35rem; color:var(--accent); }
.stat span{ font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }

.controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; }
.tab{ background:var(--surface); border:1px solid var(--line-2); color:var(--text-2); border-radius:999px; padding:8px 15px; font-size:.82rem; font-weight:500; }
.tab.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); font-weight:600; }
#search{ flex:1 1 200px; min-width:170px; padding:10px 14px; }

/* quote cards */
#list{ display:flex; flex-direction:column; gap:10px; }
.qcard{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-s); padding:16px 18px; cursor:pointer; transition:border-color .15s; display:grid; grid-template-columns:1fr auto; gap:4px 12px; }
.qcard:hover{ border-color:var(--accent-line); }
.qcard .who{ font-weight:600; font-size:1rem; }
.qcard .veh{ font-size:.85rem; color:var(--text-2); }
.qcard .meta{ font-size:.78rem; color:var(--muted); }
.qcard .amt{ font-family:var(--font-d); font-weight:700; color:var(--accent); text-align:right; font-size:1.05rem; }
.pill{ display:inline-block; font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; border-radius:999px; padding:4px 11px; border:1px solid; justify-self:end; }
.st-new{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-dim); }
.st-contacted{ color:var(--amber); border-color:rgba(251,191,36,.4); background:rgba(251,191,36,.1); }
.st-booked{ color:#c084fc; border-color:rgba(192,132,252,.4); background:rgba(192,132,252,.1); }
.st-completed{ color:var(--ok); border-color:rgba(74,222,128,.4); background:rgba(74,222,128,.08); }
.st-declined{ color:var(--muted); border-color:var(--line-2); background:var(--bg-2); }
.empty{ text-align:center; color:var(--muted); padding:60px 0; font-size:.92rem; }

/* detail overlay */
#overlay{ display:none; position:fixed; inset:0; z-index:50; background:rgba(4,6,9,.7); backdrop-filter:blur(4px); }
#overlay.open{ display:flex; align-items:flex-end; justify-content:center; }
.sheet{ width:100%; max-width:640px; max-height:88vh; overflow:auto; background:var(--surface); border:1px solid var(--line-2); border-radius:18px 18px 0 0; padding:26px 24px 34px; }
.sheet h2{ font-size:1.15rem; margin-bottom:2px; }
.sheet .veh2{ color:var(--text-2); font-size:.9rem; margin-bottom:16px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-bottom:16px; }
.kv span{ display:block; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.kv b{ font-weight:600; font-size:.92rem; word-break:break-word; }
.kv a{ color:var(--accent); text-decoration:none; }
.statusRow{ display:flex; gap:7px; flex-wrap:wrap; margin:6px 0 16px; }
.statusRow .tab{ font-size:.78rem; padding:8px 13px; }
.sheet label{ display:block; font-size:.72rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--text-2); margin:6px 0 6px; }
.sheet textarea{ min-height:88px; resize:vertical; }
.sheet-actions{ display:flex; gap:10px; margin-top:16px; }
.sheet-actions .btn-primary{ width:auto; margin-top:0; flex:1; }
#saveMsg{ font-size:.84rem; color:var(--ok); margin-top:10px; min-height:1.2em; }
@media (max-width:640px){ .stats{ grid-template-columns:repeat(2,1fr); } .grid2{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="loginView">
  <div class="login-card">
    <svg class="brand-logo" viewBox="0 0 720 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wigan Wetbelts">
      <rect x="0" y="0" width="280" height="190" fill="#000000"/>
      <rect x="280" y="0" width="440" height="190" fill="#ffffff"/>
      <rect x="3" y="3" width="714" height="184" fill="none" stroke="#ffffff" stroke-width="6"/>
      <text x="140" y="125" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="62" letter-spacing="6" fill="#ffffff">WIGAN</text>
      <text x="500" y="125" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="62" letter-spacing="6" fill="#000000">WETBELTS</text>
    </svg>
    <h1>Quotes Admin</h1>
    <p>Staff sign in. Customer quotes stay private.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button class="btn btn-primary" id="loginBtn">Sign in</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="appView">
  <div class="topbar">
    <div class="wrap topbar-inner">
      <svg viewBox="0 0 720 190" xmlns="http://www.w3.org/2000/svg" aria-label="Wigan Wetbelts">
        <rect width="280" height="190" fill="#000"/><rect x="280" width="440" height="190" fill="#fff"/>
        <rect x="3" y="3" width="714" height="184" fill="none" stroke="#fff" stroke-width="6"/>
        <text x="140" y="125" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="62" letter-spacing="6" fill="#fff">WIGAN</text>
        <text x="500" y="125" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="62" letter-spacing="6" fill="#000">WETBELTS</text>
      </svg>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="refreshBtn">Refresh</button>
        <button class="btn btn-ghost" id="logoutBtn">Log out</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="stats">
      <div class="stat"><b id="stNew">0</b><span>New</span></div>
      <div class="stat"><b id="stWeek">0</b><span>This week</span></div>
      <div class="stat"><b id="stBooked">0</b><span>Booked</span></div>
      <div class="stat"><b id="stValue">£0</b><span>Open value</span></div>
    </div>

    <div class="controls">
      <div class="tabs" id="tabs">
        <button class="tab active" data-st="">All</button>
        <button class="tab" data-st="new">New</button>
        <button class="tab" data-st="contacted">Contacted</button>
        <button class="tab" data-st="booked">Booked</button>
        <button class="tab" data-st="completed">Completed</button>
        <button class="tab" data-st="declined">Declined</button>
      </div>
      <input id="search" type="search" placeholder="Search name, reg or phone" />
    </div>

    <div id="list"></div>
  </div>
</div>

<div id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
var SB_URL = 'https://ukwakszeslxkxcyosigp.supabase.co';
var SB_KEY = 'sb_publishable_QuwBESO6L6SwTK7a2kB6fw_bXDQElMo';
var sb = window.supabase.createClient(SB_URL, SB_KEY);

var STATUSES = ['new','contacted','booked','completed','declined'];
var loginView = document.getElementById('loginView');
var appView = document.getElementById('appView');
var listEl = document.getElementById('list');
var quotes = [];
var filterStatus = '';
var searchTerm = '';
var current = null;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return (n || n === 0) ? '£' + Number(n).toLocaleString('en-GB') : ''; }
function fmtDate(d){
  if (!d) return '';
  var dt = new Date(d);
  if (isNaN(dt)) return String(d);
  return dt.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
function fmtDateTime(d){
  if (!d) return '';
  var dt = new Date(d);
  return dt.toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + ' ' +
         dt.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

/* ---------- auth ---------- */
function showApp(){ loginView.style.display = 'none'; appView.style.display = 'block'; loadQuotes(); }
function showLogin(){ loginView.style.display = 'flex'; appView.style.display = 'none'; }

sb.auth.getSession().then(function(res){
  if (res.data && res.data.session) showApp(); else showLogin();
});

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('password').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
function doLogin(){
  var btn = document.getElementById('loginBtn');
  var err = document.getElementById('loginErr');
  err.classList.remove('show');
  btn.disabled = true; btn.textContent = 'Signing in…';
  sb.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  }).then(function(res){
    btn.disabled = false; btn.textContent = 'Sign in';
    if (res.error){
      err.textContent = 'Sign in failed. Check your email and password.';
      err.classList.add('show');
      return;
    }
    showApp();
  });
}
document.getElementById('logoutBtn').addEventListener('click', function(){
  sb.auth.signOut().then(showLogin);
});

/* ---------- data ---------- */
function loadQuotes(){
  listEl.innerHTML = '<div class="empty">Loading quotes…</div>';
  sb.from('quotes').select('*').order('created_at', { ascending:false }).limit(500)
    .then(function(res){
      if (res.error){
        listEl.innerHTML = '<div class="empty">Could not load quotes. ' + esc(res.error.message) + '</div>';
        return;
      }
      quotes = res.data || [];
      renderStats();
      renderList();
    });
}
document.getElementById('refreshBtn').addEventListener('click', loadQuotes);
setInterval(function(){ if (appView.style.display === 'block' && !document.getElementById('overlay').classList.contains('open')) loadQuotes(); }, 90000);

function renderStats(){
  var now = Date.now();
  var week = 7 * 24 * 3600 * 1000;
  var stNew = 0, stWeek = 0, stBooked = 0, openVal = 0;
  quotes.forEach(function(q){
    if (q.status === 'new') stNew++;
    if (q.status === 'booked') stBooked++;
    if (q.created_at && (now - new Date(q.created_at).getTime()) < week) stWeek++;
    if ((q.status === 'new' || q.status === 'contacted' || q.status === 'booked') && q.quote_amount) openVal += Number(q.quote_amount);
  });
  document.getElementById('stNew').textContent = stNew;
  document.getElementById('stWeek').textContent = stWeek;
  document.getElementById('stBooked').textContent = stBooked;
  document.getElementById('stValue').textContent = money(openVal);
}

function matches(q){
  if (filterStatus && (q.status || 'new') !== filterStatus) return false;
  if (searchTerm){
    var hay = [q.name, q.reg, q.phone, q.make, q.model].join(' ').toLowerCase();
    if (hay.indexOf(searchTerm) === -1) return false;
  }
  return true;
}

function renderList(){
  var rows = quotes.filter(matches);
  if (!rows.length){
    listEl.innerHTML = '<div class="empty">No quotes here yet. New quotes from the website appear automatically.</div>';
    return;
  }
  listEl.innerHTML = rows.map(function(q, i){
    var veh = [q.year, q.make, q.model, q.engine].filter(Boolean).join(' ');
    return '<div class="qcard" data-id="' + esc(q.id) + '">' +
      '<div>' +
        '<div class="who">' + esc(q.name || 'No name') + (q.reg ? ' · ' + esc(q.reg) : '') + '</div>' +
        '<div class="veh">' + esc(veh || 'Vehicle not specified') + (q.job ? ' · ' + esc(q.job) : '') + '</div>' +
        '<div class="meta">' + esc(fmtDateTime(q.created_at)) + (q.pref_date ? ' · wants ' + esc(fmtDate(q.pref_date)) : '') + '</div>' +
      '</div>' +
      '<div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">' +
        '<span class="amt">' + money(q.quote_amount) + '</span>' +
        '<span class="pill st-' + esc(q.status || 'new') + '">' + esc(q.status || 'new') + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
  Array.prototype.forEach.call(listEl.querySelectorAll('.qcard'), function(card){
    card.addEventListener('click', function(){ openDetail(card.getAttribute('data-id')); });
  });
}

document.getElementById('tabs').addEventListener('click', function(e){
  var t = e.target.closest('.tab');
  if (!t) return;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'), function(x){ x.classList.remove('active'); });
  t.classList.add('active');
  filterStatus = t.getAttribute('data-st');
  renderList();
});
document.getElementById('search').addEventListener('input', function(e){
  searchTerm = e.target.value.trim().toLowerCase();
  renderList();
});

/* ---------- detail ---------- */
var overlay = document.getElementById('overlay');
overlay.addEventListener('click', function(e){ if (e.target === overlay) closeDetail(); });

function openDetail(id){
  current = quotes.find(function(q){ return String(q.id) === String(id); });
  if (!current) return;
  var q = current;
  var veh = [q.year, q.make, q.model, q.engine].filter(Boolean).join(' ');
  var sheet = document.getElementById('sheet');
  sheet.innerHTML =
    '<h2>' + esc(q.name || 'No name') + '</h2>' +
    '<div class="veh2">' + esc(veh || 'Vehicle not specified') + '</div>' +
    '<div class="grid2">' +
      kv('Reg', q.reg) +
      kv('Job', q.job) +
      kv('Estimate', money(q.quote_amount) + ' ex VAT') +
      kv('Preferred date', fmtDate(q.pref_date)) +
      kv('Phone', q.phone ? '<a href="tel:' + esc(q.phone) + '">' + esc(q.phone) + '</a>' : '', true) +
      kv('Email', q.email ? '<a href="mailto:' + esc(q.email) + '">' + esc(q.email) + '</a>' : '', true) +
      kv('Preferred contact', q.contact) +
      kv('Received', fmtDateTime(q.created_at)) +
      kv('Customer message', q.notes) +
    '</div>' +
    '<label>Status</label>' +
    '<div class="statusRow">' + STATUSES.map(function(s){
      return '<button class="tab' + ((q.status || 'new') === s ? ' active' : '') + '" data-set="' + s + '">' + s + '</button>';
    }).join('') + '</div>' +
    '<label for="adminNotes">Workshop notes</label>' +
    '<textarea id="adminNotes" placeholder="Parts ordered, dates offered, anything the team should know.">' + esc(q.admin_notes || '') + '</textarea>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-primary" id="saveBtn">Save changes</button>' +
      '<button class="btn btn-ghost" id="closeBtn">Close</button>' +
    '</div>' +
    '<div id="saveMsg"></div>';
  overlay.classList.add('open');

  var chosen = q.status || 'new';
  Array.prototype.forEach.call(sheet.querySelectorAll('[data-set]'), function(b){
    b.addEventListener('click', function(){
      chosen = b.getAttribute('data-set');
      Array.prototype.forEach.call(sheet.querySelectorAll('[data-set]'), function(x){ x.classList.remove('active'); });
      b.classList.add('active');
    });
  });
  document.getElementById('closeBtn').addEventListener('click', closeDetail);
  document.getElementById('saveBtn').addEventListener('click', function(){
    var btn = this;
    btn.disabled = true; btn.textContent = 'Saving…';
    sb.from('quotes').update({
      status: chosen,
      admin_notes: document.getElementById('adminNotes').value || null,
      updated_at: new Date().toISOString()
    }).eq('id', q.id).then(function(res){
      btn.disabled = false; btn.textContent = 'Save changes';
      var msg = document.getElementById('saveMsg');
      if (res.error){
        msg.style.color = 'var(--warn)';
        msg.textContent = 'Save failed: ' + res.error.message;
        return;
      }
      msg.style.color = 'var(--ok)';
      msg.textContent = 'Saved.';
      q.status = chosen;
      q.admin_notes = document.getElementById('adminNotes').value || null;
      renderStats(); renderList();
    });
  });

  function kv(label, val, isHtml){
    return '<div class="kv"><span>' + label + '</span><b>' + (isHtml ? (val || 'Not provided') : esc(val || 'Not provided')) + '</b></div>';
  }
}
function closeDetail(){ overlay.classList.remove('open'); current = null; }
})();
</script>
</body>
</html>
